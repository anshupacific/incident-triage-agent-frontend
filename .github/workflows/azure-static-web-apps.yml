# Builds the site and deploys it to Azure Static Web Apps on every push to main.
# Repository settings needed:
#   Secret   AZURE_STATIC_WEB_APPS_API_TOKEN  (Static Web App > Overview > Manage deployment token)
#   Variable VITE_API_BASE_URL                (backend URL, e.g. https://<app>.azurewebsites.net)
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
